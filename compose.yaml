# docker compose up -d   →  http://localhost:8080/
# Another port: ASCIIGRAPH_PORT=3000 docker compose up -d   (or 127.0.0.1:3000 for this machine only)
services:
  asciigraph:
    build: .
    image: asciigraph
    ports:
      - "${ASCIIGRAPH_PORT:-8080}:8080"
    restart: unless-stopped
  # Live diagrams (several people editing one at once): kept in the "live-diagrams" volume.
  collab:
    build:
      context: .
      target: collab
    image: asciigraph-collab
    volumes:
      - live-diagrams:/data
    restart: unless-stopped

volumes:
  live-diagrams:
