server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built assets have content hashes in their names: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Live diagrams: the "collab" service (compose.yaml), looked up when a request comes in (with
    # the container's DNS server, filled in at startup), so this starts, and the rest works,
    # without it.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $collab http://collab:1234;
    location ~ /api/ {
        proxy_pass $collab;
        proxy_set_header Host $host;
        client_max_body_size 6m;
    }
    location ~ /ws$ {
        proxy_pass $collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # The page itself: always check for a new version.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
